name: Build and Release Bitstream

on:
  push:
    branches:
      - "**"
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/hmatt1/vctx-lang:latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup vctx command
        run: |
          cp .devcontainer/vctx /usr/local/bin/vctx
          chmod +x /usr/local/bin/vctx

      - name: Build Bitstream
        run: ./build.sh

      - name: Install zip
        run: |
          apt-get update && apt-get install -y zip

      - name: Zip Artifacts
        run: zip -j bitstream.zip build/*.fs build/*.sv board.cst
          
      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: bitstream
          path: bitstream.zip
          
      - name: Create Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: bitstream.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
